<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="gmd-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="gmd-plus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Badge + Stylized + / M) -->
  <g transform="translate(4, 4)">
    <!-- Outer Rounded Hexagon / Square -->
    <rect x="0" y="0" width="52" height="52" rx="14" fill="url(#gmd-blue)" />
    
    <!-- Digital grid accents -->
    <circle cx="10" cy="10" r="1.5" fill="#A5F3FC" opacity="0.6" />
    <circle cx="42" cy="10" r="1.5" fill="#A5F3FC" opacity="0.6" />
    <circle cx="10" cy="42" r="1.5" fill="#A5F3FC" opacity="0.6" />
    <circle cx="42" cy="42" r="1.5" fill="#A5F3FC" opacity="0.6" />
    
    <!-- Central Bold "M+" Icon -->
    <!-- Stylized 'M' with '+' integration -->
    <path d="M12 36V16L21 28L30 16V36" stroke="white" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Glowing '+' Symbol -->
    <path d="M38 21V31M33 26H43" stroke="url(#gmd-plus)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <!-- "GRUPO" -->
  <text x="68" y="24" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">
    GRUPO
  </text>

  <!-- "MÁS DIGITAL" -->
  <text x="68" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">
    <tspan fill="#FFFFFF">MÁS </tspan>
    <tspan fill="#38BDF8">DIGITAL</tspan>
  </text>
</svg>
